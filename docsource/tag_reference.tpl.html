<div class="informaltable">
<table class="table">
  <tbody>
    <tr>
      <th>Tag Name</th>
      <th>Type</th>
      <th>Parameter</th>
      <th>Example</th>
      <th>Description</th>
    </tr>
    [SET_MARKUP]["$","$"]
    $MACRO_BEGIN$$TRIM$
    <tr>
      <td>$ENTRY$["Tag Name"]</td>
      <td>$ENTRY$["Type"]</td>
      <td>$BEGIN$$ENTRY$["Parameter"]$OR$ $END$</td>
      <td><pre>$ENTRY$["Syntax Example"]</pre></td>
      <td>$ENTRY$["Description"]$MERGE$[" "]</td>
    </tr>
    $MACRO_END$$TRIM$    
  </tbody>
</table>
</div>
